# docx-content-review 默认配置（spec §16）
# 用户覆盖：--config <file>，按 key 深合并。
# apply_threshold 由程序强制为 conservative，写什么都无效（D4）。

compatibility:
  spec_version: "1.1"
  schema_version: "3"
  min_workspace_version: "2"    # 低于此版本的 workspace 需迁移而非直接续跑

strictness: balanced            # conservative | balanced | thorough
apply_threshold: conservative   # 固定，不可放宽

chunking:
  max_context_tokens: 100000    # 切分判据：正文+指令+术语摘要+衔接+输出预留
  # 每片正文上限。系数修正之后这个数字的含义变了：以前 15000 里有 2.4 倍的虚高，
  # 实际只装得下约 9400 个汉字；现在 10000 ≈ 10000 个汉字（约 25 页）。
  #
  # **这个数由子 Agent 的窗口决定，不由文档决定。** 15000 在两个中等 harness 上
  # 实测会让子 Agent 溢出（一波 5 个失败 3 个）——溢出的往往不是输入而是**输出**：
  # 事实抽取的产出长度与正文成正比，片越大越容易撞上单次输出上限，
  # 截断的 JSON 解析不了，这一片就永远跑不完。
  # 想更快可以往上调（片数即调用数），但片越大模型的定位准确率越掉，
  # 而定位准确率的优先级高于所有召回指标。调之前先看 prompt_pack 的 max_chars。
  max_text_tokens: 10000
  # 单个子 Agent 的 prompt 上限（字符）。prompt_pack.py build 超了就以退出码 8 终止，
  # 并直接给出 max_text_tokens 该设成多少——**在派活之前拦下来**，
  # 而不是等一波跑完看到"5 个失败 3 个"再去猜原因。0 = 不限。
  # 子 Agent 窗口大（≥128k）可以放宽到 40000；窗口小就和 max_text_tokens 同比例调小。
  max_prompt_chars: 20000
  single_pass_limit: 22000
  # tokenizer 不可得时的保守系数。_estimate 已经把 CJK 逐字记 1 token，
  # 而真实 tokenizer 对中文约 1 token / 1.4–1.7 字，逐字记 1 本身就保守了 40%+。
  # 再乘 1.6 等于一个汉字算 1.6 token —— 高估约 2.4 倍，直接把片数抬高 2–3 倍，
  # 而片数就是 Pass 1 的调用数与工具轮次数。实测 21 万字的文档被切成 31 片，
  # 真实 token 只有约 14 万，每片正文只装了 45k 上下文预算的 10%。
  token_fallback_ratio: 1.0
  overlap_paragraphs: 2
  # 遇到 H2/H3 且本片已装到这个比例时就断开，让分片对齐章节。
  # 0.5 意味着平均每片只装了七成预算——章节多的文档会因此多切出三分之一的片。
  split_point_fill_ratio: 0.7
  # 片变大时这个上限必须同步变大：它是截断源，不是"每片就这么多问题"。
  # 片大 2.5 倍而上限不动 = 拿召回换速度，与优先级排序相悖。
  #
  # **它同时是输出侧的上限，而输出侧才是子 Agent 真正撞墙的地方。**
  # 40 条 × 最坏一条（跨度上限 120 字 ×2 + evidence 25 + 键名）≈ 14,000 token，
  # 而 output_reserve_tokens 只留了 8,000——这两个数以前从来没有对过账。
  # 实跑现场：个别片挂六次才偶然成功，harness 报「ran out of room」，
  # 即子 Agent 单轮生成被截断、产物没写成。**这类失败重试无效**——
  # 同一个 prompt 会再撞一次，成不成取决于当次思考多长（随机）。
  # 一片被截断 = 这一片零产出，所以 20 条严格优于会截断的 40 条。
  # prompt_pack.py build 现在会对这道账，超了就以退出码 8 拦在派活之前。
  max_issues_per_chunk: 20
  min_b_class_slots: 10         # 截断时为 B 类保留的下限席位。A 类恒 High、B 类恒 Medium，
                                # 纯按 severity 截断会让 B 类被 A 类整组挤掉（同 §9.7 的配额挤占）
  instruction_tokens: 9000      # 技能指令 + 类型体系 + 不改清单
  glossary_tokens: 4000         # 术语表摘要预算；**没有术语表时 chunk.py 按 0 计**
  # 输出预留。**这不再只是切分账上的一个数**：prompt_pack.py 拿它校验
  # 「max_issues_per_chunk 条最坏输出」装不装得下。子 Agent 单轮输出额度确实
  # 更大时可以调高，调高之后条数上限也能跟着放宽。
  output_reserve_tokens: 10000
  table_only_text_ratio: 0.10   # 正文段落占比低于此值即判为纯表格片

logic:
  # 术语类规则：L01 术语定义不一致 / L02 缩略语不一致 / L03 缩略语未展开 /
  # L04 名称写法不一致 / L05 近义术语混用 / L25 禁用写法 / L26 未用标准写法。
  # 关闭时这七条不跑、不产候选，Pass 0 的术语抽取（LLM 调用）也一并跳过——
  # 它存在的目的就是喂这几条规则。用户自备的术语表照常导入，N7 的压制不受影响。
  # 报告的「本次未覆盖范围」会写明这一维度没查。改成 true 即恢复，不需要改代码。
  term_rules: false
  gap_ratio: 3                  # L27 目标值与实测值差异倍数阈值
  adjudicate_batch_size: 10     # Pass 4 每批裁定的候选组数（adjudicate_pass4.py build）
  coverage_rules_to_comment: false   # L29–L32 默认只进报告
  percent_tolerance: 0.5        # L09 百分比合计容差
  entity_similar_distance: 2    # L04 写法相近判定的编辑距离上限

typo_check:
  enabled: true                 # 独立通道：脚本出候选 → LLM 二选一裁定 → 过闸门②③
  max_typos_per_chunk: 200      # 独立配额，不占用 max_issues_per_chunk
  # A1 的跨度下限，独立于 verification.min_span_chars（那条挡的是"模型圈了
  # 一两个字、没有依据"）。A1 的跨度来自确定性词表，两个字的错字就是两个字；
  # 共用一个下限会逼着这条通道把跨度撑宽，修订与批注就会圈住一大片。
  min_span_chars: 2
  # 每批一个题面文件，子 Agent 只读自己那一批。批越大，单个子 Agent 的上下文越大——
  # 这条通道的候选量是三条里最大的，50 是实测能稳住的上限。
  batch_size: 50
  require_llm_adjudication: true # 脚本候选不得直接生成修订
  # 同形扩散：一处错字被确认之后，全文其余同形之处一并成条目（typo_scan.py propagate）。
  # 词表扫不到的写法（英文拼写、臆造词）只会被主审查在某一片偶然发现，
  # 其余各处无人管——用户看到的是「改了第一处，后面几处原样留着」。
  # 扩散出来的条目照常过闸门②③，并逐条进闸门④盲测，不直接落笔。
  propagate_confirmed: true
  max_propagated: 500           # 全文扩散总量上限（防止一个高频写法撑爆闸门④）
  max_propagated_per_chunk: 200 # 扩散通道的单片配额，与错别字通道各自独立
  # 未登录词检测（切词后查不到的词即可疑）需 5 万词级词表才有信噪比，
  # 内置词表远未达到该规模，故不启用。召回率上限 = common-typos.txt 的覆盖范围。
  oov_detection: false

pattern_review:                 # P 类：特定场景的描述范式审查
  enabled: false                # 默认关闭；无规则包时即使打开也自动跳过
  use_builtin: true             # 加载 assets/patterns/*.yaml（内置的是示例，可删）
  packs: []                     # 额外规则包路径；--patterns 可追加，同 id 后者覆盖前者
  max_pattern_issues_per_chunk: 40  # 独立配额，不占用 max_issues_per_chunk
  batch_size: 20
  # P 类的跨度上限，独立于 verification.max_span_chars（0 = 不限）。
  # 后者的判据是「跨度太长说明模型在圈整段」，而 P 类的 original_text 按设计就是整段——
  # 共用一个上限会把真实文档里超过 120 字的风险条目、接口描述整组丢掉。
  max_span_chars: 0
  severity_cap: Medium          # 依赖场景定位准确性，与 L29–L32 同理，不配 High
  unsure_as_present: true       # 「不确定」按要件齐备处理（不确定即无问题）

argument_review:
  enabled: false                # v2 能力，默认关闭
  max_issues: 50

review_memory:
  enabled: true
  path: null                    # null = <输出根>/docx-review/review-memory.json
  exact_match_only: true        # 严禁自动泛化

priority_score:
  enabled: true
  decision_use: false           # 硬性：不得参与任何自动判定

verification:
  enable_second_pass: true
  blind_ab_test: true             # 盲测 A/B，含位置随机化
  unsure_as_negative: true
  edit_gate_by_category: true     # 按错误类型分别校验
  max_edit_distance_abs: 30       # 兜底阈值，类型校验之外的最后一道
  max_edit_distance_ratio: 0.4
  min_span_chars: 4
  max_span_chars: 120
  verify_batch_size: 10

workspace:
  # 交付目录：最终产物（审查版 docx / 报告 / issues.xlsx…）落在这里。
  # null = Agent 当前工作目录。优先级：--output-dir > DOCX_REVIEW_OUTPUT_DIR > 本项 > CWD
  output_dir: null
  # 临时目录根：只放中间件（副本、解包、分片、台账、冲突候选…），可整体删除。
  # null = 跟随交付目录，即中间件落在 <工作目录>/docx-review/ 之下。
  # 只有工作目录在网络盘、或想把大体积中间件挪到别的盘时才需要显式指定。
  # 优先级：--temp-dir > DOCX_REVIEW_TEMP_DIR > 本项 > 交付目录
  temp_dir: null
  clean_temp_on_success: false  # 全流程成功后删除本次 run 的临时目录（技能稳定后可开）
  subdir: "docx-review"
  slug_max_chars: 40
  hash_prefix_len: 12
  verify_full_hash: true        # 命中目录后必须比对完整 sha256
  keep_runs: 3
  clean_intermediate: false
  min_free_space_multiplier: 6

concurrency:
  parallelism: 5                # subAgent 工作池大小，建议上限 8，由压测确定
  # 一个子 Agent 一次领多少 prompt（字符）。**派活的固定开销与单元大小无关**：
  # 拉起子 Agent、领单元、读文件、回话，在 60 token/s 的出字速度下光"吐出一次
  # 工具调用"就要一两秒，几十个单元摊下来能占总耗时三四成。所以按预算打包：
  # 小单元（错别字一批几千字符）一次给五六个，大单元（审查一片近两万）一次给两个。
  # 这不是单个 prompt 的上限——那是 chunking.max_prompt_chars。
  # 子 Agent 窗口小就调小，但不要小于 max_prompt_chars，否则永远只能一个一个派。
  #
  # **40000 是按 ≤64k 窗口定的。** 800 页文档实测：这个值配 `--count 4` 是
  # 34 次 claim next / 29 个子 Agent / 主 Agent 上下文 53k 字符；
  # 128k 窗口上调到 120000 配 `--count 6` 是 14 次 / 10 个 / 33k 字符。
  # 省的是派活开销与主 Agent 上下文，**不是生成时间**（总输出量不变），
  # 代价是子 Agent 的每轮重算变大、崩一次丢的单元变多。不要一路调到窗口上限。
  subagent_budget_chars: 40000
  # 「每次调用前后都续期」在一个子 Agent 连做多片时是必要的，但那个模型本身已废弃：
  # 现在一个子 Agent 只做一片、做完即退，claim 的生命周期就是这一片，
  # 6 次续期换来的只是 6 轮工具往返（每轮都要重算整个上下文）。
  # TTL 同步从 20 分钟抬到 60 分钟覆盖单片全程。
  renew_claim_on_llm_call: false
  pipeline_pass2: false         # v1 不做 Pass1/Pass2 流水线并行
  allow_collaboration: true     # 允许多会话分工处理同一文档（§11.3）
  lease_minutes: 30             # 独占租约 TTL（心跳续租，不基于 pid）
  # 单元 claim TTL。一个单元 = 一次调用，正常几分钟就完；定得越长，子 Agent 崩掉
  # 之后那个单元被锁死的时间越长（所以每波结束都要 claim reclaim 一次）。
  chunk_claim_minutes: 30
  require_local_fs: true        # 非本地文件系统时关闭协作，fail-closed
  on_conflict: ask              # ask | join | refuse

glossary:
  sources:
    authoritative: null         # 路径；CSV/XLSX/YAML/JSON/TXT
    fallback: null              # 兜底术语，默认 enforce=off
  enforce_defaults:
    authoritative: "error"
    extracted: "warn"
    fallback: "off"           # 必须加引号：裸 off 会被 YAML 解析为布尔 false
  fail_on_source_conflict: true # 外部表自身矛盾时终止，不做猜测性合并
  skip_definition_inference_for_known: true
  min_term_freq: 3              # 预筛：候选术语最低词频
  max_candidates: 500           # 预筛候选上限
  cluster_distance: 2           # 概念族候选聚类的编辑距离上限

style_guard:                    # D9，全部不可关闭
  verify_style_files_hash: true
  forbid_format_revisions: true
  verify_rpr_per_run: true

page_estimation:
  source: auto                  # auto | app_xml | pagebreak | constant
  fallback_chars_per_page: 400
  app_xml_sanity_range: [100, 1200]

output:
  author_name: "内容审查"
  max_revisions: 2000
  emit_glossary: true
  # 交付物命名：{stem}=原文件名（去扩展名），{ts}=时间戳，{ext}=各产物后缀
  filename_pattern: "{stem}审查版_{ts}{ext}"
  timestamp_format: "%Y%m%d_%H%M%S"
  # 只有审查版 docx 是交付物。以下四项默认 false：产物照常生成，但留在
  # <run>/output/ 内，随临时目录一起清理，不堆到用户的工作目录。
  # 需要哪个就把哪个改成 true。
  deliver_report: false
  deliver_issues_xlsx: false
  deliver_metrics: false
  deliver_glossary: false

skip:
  code_blocks: true
  tables_language_check: true    # 表格内不做语病审查，仍参与逻辑台账
  quoted_regulations: true

retry:
  max_attempts_per_chunk: 3
